<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Painel de operação, diagnóstico e documentação do projeto de robótica no galpão."><title>RoboLab — Operação do galpão</title><link rel="stylesheet" href="style.css"><script defer src="historico.js"></script><script defer src="app.js"></script></head>
<body><aside class="rail"><a class="brand" href="#visao"><span class="logo">⌖</span><span>RoboLab<small>PROJETO DE ROBÓTICA</small></span></a><nav aria-label="Seções do projeto"></nav><div class="rail-end"><i></i> Projeto acadêmico <small>Ciência da Computação</small></div></aside>
<main><header><span id="crumb">Projeto / Visão geral</span><button class="primary" id="new">＋ Novo registro</button></header><div class="content" id="view"></div></main>
<dialog id="editor"><form id="entry"><div class="row"><h2 id="form-title">Novo registro</h2><button type="button" id="close" aria-label="Fechar">✕</button></div><label>Tipo<select name="kind"><option>Alteração no código</option><option>Teste</option><option>Print</option><option>Pendência</option><option>Próximo passo</option></select></label><label>Título<input name="title" required maxlength="120"></label><label>Situação<select name="status"><option>Pendente</option><option>Em andamento</option><option>Concluído</option><option>Aprovado</option><option>Falhou</option></select></label><label>Detalhes<textarea name="notes" rows="4" placeholder="Arquivo e commit, cenário, resultado esperado e observado…"></textarea></label><label>Print opcional (até 2 MB)<input name="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><label id="remove-label" hidden><input name="remove" type="checkbox"> Remover print atual</label><button class="primary">Salvar registro</button></form></dialog><div id="toast" role="status"></div></body></html>
