<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboLab · Robô em realidade aumentada</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    aside { position: fixed; z-index: 10; top: 12px; left: 12px; right: 12px;
            max-width: 390px; color: #effbf7; background: #10211fee;
            padding: 12px 15px; border-radius: 11px; }
    p { margin: 4px 0 0; font-size: .92rem; }
    a { color: #83f1ce; }
  </style>
</head>
<body>
  <aside>
    <strong>RoboLab · Robô em AR</strong>
    <p id="status" role="status">Permita o acesso à câmera e aponte para o marcador Hiro.</p>
    <p><a target="_blank" rel="noopener" href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png">Abrir marcador Hiro</a></p>
  </aside>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
           vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-marker id="hiro" preset="hiro" emitevents="true" smooth="true">
      <a-entity id="robo" scale="0.4 0.4 0.4"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    const status = document.getElementById('status');
    const marker = document.getElementById('hiro');
    const robot = document.getElementById('robo');
    let modelState = 'loading';

    const updateStatus = () => {
      status.textContent = modelState === 'error'
        ? 'O modelo do robô não carregou. Recarregue a página.'
        : !marker.object3D?.visible
          ? 'Aponte a câmera para o marcador Hiro inteiro.'
          : modelState === 'ready'
            ? 'Marcador detectado. O robô está em exibição.'
            : 'Marcador detectado. Carregando o robô…';
    };

    if (!window.AFRAME?.components.arjs && !window.AFRAME?.systems.arjs) {
      status.textContent = 'Não foi possível carregar as bibliotecas de AR. Confira a conexão e recarregue.';
    } else if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      status.textContent = 'Abra a prévia em uma aba separada com HTTPS para usar a câmera.';
    } else {
      window.addEventListener('camera-error', () => {
        status.textContent = 'Câmera indisponível. Confira a permissão do navegador e recarregue a página.';
      });
      marker.addEventListener('markerFound', updateStatus);
      marker.addEventListener('markerLost', updateStatus);
      robot.addEventListener('model-loaded', () => { modelState = 'ready'; updateStatus(); });
      robot.addEventListener('model-error', () => { modelState = 'error'; updateStatus(); });
